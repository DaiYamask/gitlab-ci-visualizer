stages:
  - build
  - test
  - deploy

variables:
  DOCKER_IMAGE: "registry.example.com/my-project:$CI_COMMIT_REF_SLUG"

build:
  stage: build
  script:
    - echo "Building the application"
    - make build
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: always
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: always

test:unit:
  stage: test
  script:
    - echo "Running unit tests"
    - make test-unit
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: always
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: always

test:integration:
  stage: test
  script:
    - echo "Running integration tests"
    - make test-integration
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: always
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_LABELS =~ /integration-tests/
      when: always
    - when: never

deploy:staging:
  stage: deploy
  script:
    - echo "Deploying to staging"
    - make deploy-staging
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
    - when: never

deploy:production:
  stage: deploy
  script:
    - echo "Deploying to production"
    - make deploy-production
  rules:
    - if: $CI_COMMIT_TAG
      when: manual
    - when: never
