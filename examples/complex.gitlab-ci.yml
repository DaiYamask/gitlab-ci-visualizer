stages:
  - prepare
  - build
  - test
  - deploy
  - cleanup

variables:
  DOCKER_IMAGE: "registry.example.com/my-project:$CI_COMMIT_REF_SLUG"
  GO_VERSION: "1.18"

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG

.base_job:
  tags:
    - docker

prepare:env:
  stage: prepare
  extends: .base_job
  script:
    - echo "Preparing environment"
    - make setup-env
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: always
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: always
    - if: $CI_COMMIT_TAG
      when: always

build:app:
  stage: build
  extends: .base_job
  script:
    - echo "Building application"
    - make build
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: always
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: always
    - if: $CI_COMMIT_TAG
      when: always

build:docker:
  stage: build
  extends: .base_job
  script:
    - echo "Building Docker image"
    - docker build -t $DOCKER_IMAGE .
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: always
    - if: $CI_COMMIT_TAG
      when: always
    - when: never

test:unit:
  stage: test
  extends: .base_job
  script:
    - echo "Running unit tests"
    - make test-unit
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: always
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: always
    - if: $CI_COMMIT_TAG
      when: always

test:integration:
  stage: test
  extends: .base_job
  script:
    - echo "Running integration tests"
    - make test-integration
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: always
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_LABELS =~ /integration-tests/
      when: always
    - when: never

test:e2e:
  stage: test
  extends: .base_job
  script:
    - echo "Running end-to-end tests"
    - make test-e2e
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: always
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_LABELS =~ /e2e-tests/
      when: always
    - when: never

deploy:staging:
  stage: deploy
  extends: .base_job
  environment:
    name: staging
    url: https://staging.example.com
  script:
    - echo "Deploying to staging"
    - make deploy-staging
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
    - when: never

deploy:production:
  stage: deploy
  extends: .base_job
  environment:
    name: production
    url: https://example.com
  script:
    - echo "Deploying to production"
    - make deploy-production
  rules:
    - if: $CI_COMMIT_TAG
      when: manual
    - when: never

cleanup:
  stage: cleanup
  extends: .base_job
  script:
    - echo "Cleaning up resources"
    - make cleanup
  rules:
    - when: always
