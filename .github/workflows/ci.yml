name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.18'
          cache: true

      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin v1.55.2
          $(go env GOPATH)/bin/golangci-lint --version

      - name: Lint
        run: $(go env GOPATH)/bin/golangci-lint run ./...

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.18'
          cache: true

      - name: Run unit tests
        run: go test -v ./...

      - name: Build for testing examples
        run: go build -o bin/gitlabviz ./cmd/gitlabviz

      - name: Test with simple.gitlab-ci.yml
        run: ./bin/gitlabviz show examples/simple.gitlab-ci.yml

      - name: Test with complex.gitlab-ci.yml
        run: ./bin/gitlabviz show examples/complex.gitlab-ci.yml

      - name: Test JSON format
        run: ./bin/gitlabviz show --format json examples/simple.gitlab-ci.yml

      - name: Test YAML format
        run: ./bin/gitlabviz show --format yaml examples/simple.gitlab-ci.yml

      - name: Test table format
        run: ./bin/gitlabviz show --format table examples/simple.gitlab-ci.yml
        
      - name: Test dependencies flag
        run: ./bin/gitlabviz show --dependencies examples/complex.gitlab-ci.yml
        
      - name: Test dependencies with JSON format
        run: ./bin/gitlabviz show --dependencies --format json examples/complex.gitlab-ci.yml
        
      - name: Test dependencies with table format
        run: ./bin/gitlabviz show --dependencies --format table examples/complex.gitlab-ci.yml
        
      - name: Test expand-vars flag
        run: ./bin/gitlabviz show --expand-vars examples/variables.gitlab-ci.yml
        
      - name: Test expand-vars with JSON format
        run: ./bin/gitlabviz show --expand-vars --format json examples/variables.gitlab-ci.yml
        
      - name: Test expand-vars with YAML format
        run: ./bin/gitlabviz show --expand-vars --format yaml examples/variables.gitlab-ci.yml
        
      - name: Test expand-vars with table format
        run: ./bin/gitlabviz show --expand-vars --format table examples/variables.gitlab-ci.yml
        
      - name: Test expand-vars with CI variables
        run: ./bin/gitlabviz show --expand-vars --ci-vars CI_COMMIT_BRANCH=main,CI_PIPELINE_SOURCE=push examples/variables.gitlab-ci.yml

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.18'
          cache: true

      - name: Build
        run: make build

      # Skip artifact upload for now
      # - name: Upload Linux build artifact
      #   uses: actions/upload-artifact@v2
      #   with:
      #     name: gitlabviz-linux
      #     path: bin/gitlabviz

  build-all:
    name: Build All Platforms
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.18'
          cache: true

      - name: Build all platforms
        run: make build-all

      # Skip artifact upload for now
      # - name: Upload all build artifacts
      #   uses: actions/upload-artifact@v2
      #   with:
      #     name: gitlabviz-all-platforms
      #     path: bin/
