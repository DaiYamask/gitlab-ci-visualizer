# GitLab CI configuration for gitlab-ci-visualizer

stages:
  - lint
  - test
  - build

variables:
  GO_VERSION: "1.18"
  GOLANGCI_LINT_VERSION: "v1.55.2"

# Cache Go modules to speed up builds
cache:
  paths:
    - .cache/go-build/
    - .cache/golangci-lint/

# Default settings for all jobs
default:
  image: golang:${GO_VERSION}
  before_script:
    - mkdir -p .cache/go-build/ .cache/golangci-lint/
    - export GOPATH="$CI_PROJECT_DIR/.cache/go-build"
    - go version
    - go mod download

# Lint stage
lint:
  stage: lint
  script:
    - curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin ${GOLANGCI_LINT_VERSION}
    - golangci-lint --version
    - golangci-lint run ./...
  cache:
    paths:
      - .cache/golangci-lint/
    policy: pull-push

# Test stage
test:unit:
  stage: test
  script:
    - go test -v ./...

test:examples:
  stage: test
  script:
    - go build -o bin/gitlabviz ./cmd/gitlabviz
    - echo "Testing with simple.gitlab-ci.yml"
    - ./bin/gitlabviz show examples/simple.gitlab-ci.yml
    - echo "Testing with complex.gitlab-ci.yml"
    - ./bin/gitlabviz show examples/complex.gitlab-ci.yml
    - echo "Testing JSON format"
    - ./bin/gitlabviz show --format json examples/simple.gitlab-ci.yml
    - echo "Testing YAML format"
    - ./bin/gitlabviz show --format yaml examples/simple.gitlab-ci.yml
    - echo "Testing table format"
    - ./bin/gitlabviz show --format table examples/simple.gitlab-ci.yml

# Build stage
build:linux:
  stage: build
  script:
    - make build
  artifacts:
    paths:
      - bin/gitlabviz
    expire_in: 1 week

build:all:
  stage: build
  script:
    - make build-all
  artifacts:
    paths:
      - bin/
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG
      when: always
    - if: $CI_COMMIT_BRANCH == "main"
      when: always
    - when: never
